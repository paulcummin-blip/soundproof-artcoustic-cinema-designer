ctd class=\"content-card\" style=\"padding:40px;\">\n                                        \u003ch1 class=\"mobile-text\" style=\"font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:22px;font-weight:700;color:#213428;margin:0 0 18px;line-height:1.25;text-align:center;\">\n    Welcome to Sound Proof\n\u003c/h1>\n\u003cp class=\"mobile-text\" style=\"color:#1B1A1A;font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:16px;margin:0 0 16px;line-height:1.5;font-weight:400;\">\n    As an Artcoustic Premium Partner, you now have access to Sound Proof with early access and unlimited usage for 3 months. Sound Proof is Artcoustic's professional home cinema design platform.\n\u003c/p>\n\u003cp class=\"mobile-text\" style=\"color:#1B1A1A;font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:16px;margin:0 0 24px;line-height:1.5;font-weight:400;\">\n    Sound Proof helps you design, develop and present home cinema systems, with loudspeaker placement, acoustic analysis and performance predictions aligned with CEDIA RP22 principles.\n\u003c/p>\n\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" class=\"invite-wrap\" style=\"margin:8px 0 28px;\">\n    \u003ctr>\n        \u003ctd style=\"text-align:center;\">\n            \u003ca href=\"https://www.soundproofcinemadesigner.com\" class=\"invite-btn\" style=\"background-color:#213428;color:#FFFFFF;text-decoration:none;display:inline-block;width:auto;max-width:100%;box-sizing:border-box;padding:14px 34px;border-radius:8px;font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:16px;font-weight:600;border:1px solid #213428;\">\n                Open Sound Proof\n            \u003c/a>\n        \u003c/td>\n    \u003c/tr>\n\u003c/table>\n\u003cp class=\"mobile-text\" style=\"color:#1B1A1A;font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:16px;margin:0 0 18px;line-height:1.5;font-weight:400;\">\n    Your Sound Proof account is now active. Your initial \u003cstrong style=\"color:#1B1A1A;font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-weight:700;\">90-day licence\u003c/strong> has started.\n\u003c/p>\n\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" style=\"margin:0 0 18px;\">\n    \u003ctr>\n        \u003ctd class=\"about-box\" style=\"background-color:#F3F0EB;border-radius:8px;padding:20px 22px;text-align:left;border:1px solid #DCDBD6;\">\n            \u003cp style=\"margin:0 0 6px;color:#1B1A1A;font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:16px;font-weight:400;line-height:1.5;\">You can sign in directly at:\u003c/p>\n            \u003cp style=\"margin:0;\">\u003ca href=\"https://www.soundproofcinemadesigner.com\" style=\"color:#213428;font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:16px;font-weight:700;text-decoration:none;\">www.soundproofcinemadesigner.com\u003c/a>\u003c/p>\n        \u003c/td>\n    \u003c/tr>\n\u003c/table>\n\u003cp class=\"mobile-text\" style=\"font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:16px;font-weight:700;color:#213428;margin:0 0 6px;line-height:1.3;\">\n    Device compatibility\n\u003c/p>\n\u003cp class=\"mobile-text\" style=\"color:#1B1A1A;font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:16px;font-weight:400;margin:0 0 26px;line-height:1.5;\">\n    Sound Proof is currently designed for desktop and laptop browsers. iPad optimisation is planned for Q1 2027.\n\u003c/p>\n\u003cp class=\"mobile-text\" style=\"color:#1B1A1A;font-family:'Didact Gothic', 'Century Gothic', Arial, sans-serif;font-size:16px;margin:0 0 26px;line-height:1.5;font-weight:400;\">\n    When your licence expires, renew it through your secure Artcoustic Dealer Portal. Your existing projects and designs will remain available.\n\u003c/p>\n\u003ch2 class=\"mobile-text\" style=\"fo
