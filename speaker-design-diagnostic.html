<!doctype html><html><head><meta charset="UTF-8"><title>Internal Speaker Design PDF validation</title></head><body>
<div style="padding:20px;background:#eee"><h1>Internal Speaker Design PDF validation</h1><p>Read-only Dixon design. No project assets are created or replaced. Optional test upload uses private file storage only.</p>
<button id="load">Load saved Dixon schedule</button> <button id="capture" disabled>Capture fresh PDF</button> <button id="store" disabled>Store internal test PDF</button> <button id="large" disabled>Capture larger schedule fixture</button>
<div id="links"></div><pre id="status">Ready</pre><pre id="measure"></pre></div><div id="schedule" style="width:178mm;margin:20px auto"></div>
<script type="module">
import '/src/index.css';
import {base44} from '/src/api/base44Client.js';
import {mergeProjectAndVersion} from '/src/lib/versionAuthority.js';
import {buildSpeakerDesignFromVersion} from '/src/components/report/speakerDesign/buildSpeakerDesignFromVersion.js';
import {buildSpeakerDesignIssuedNode} from '/src/components/report/speakerDesign/speakerDesignIssuedDocument.js';
import {snapshotIssuedComposition} from '/src/components/library/issuedDocument/recordIssuedExport.js';
import {captureCompositionToPdf} from '/src/components/library/compositionCapture.js';
import {resolveIssuedDocumentUrl} from '/src/components/library/issuedDocument/issuedDocumentActions.js';
const $=id=>document.getElementById(id); let data, captured, uploaded, measurements=[];
const status=x=>$('status').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
const link=(label,href,name)=>{const a=document.createElement('a');a.textContent=label;a.href=href;a.style='display:block;color:blue';if(name)a.download=name;else a.target='_blank';$('links').append(a);};
const measure=(doc,label)=>{const root=doc.querySelector('.speaker-design-schedule');if(!root)return;const outer=e=>{const s=doc.defaultView.getComputedStyle(e);return +(e.getBoundingClientRect().height+parseFloat(s.marginTop)+parseFloat(s.marginBottom)).toFixed(2)};measurements.push({label,font:doc.defaultView.getComputedStyle(root).fontFamily,rootHeight:root.getBoundingClientRect().height,blocks:[...root.children].filter(e=>e.tagName!=='STYLE').map(e=>({type:e.className||e.tagName,height:outer(e),rows:e.querySelectorAll('tbody tr').length})),rows:[...root.querySelectorAll('tbody tr')].map(e=>({text:e.innerText,height:e.getBoundingClientRect().height})),pages:[...root.querySelectorAll('.speaker-design-page')].map(e=>({height:outer(e),rows:e.querySelectorAll('tbody tr').length,footer:!!e.querySelector('.foot')}))});$('measure').textContent=JSON.stringify(measurements,null,2)};
function node(){const n=buildSpeakerDesignIssuedNode(data);$('schedule').replaceChildren(n);return n}
$('load').onclick=async()=>{try{status('Loading saved design…'); const [ps,vs]=await Promise.all([base44.entities.Project.filter({id:'6afef0604b9d2fdbc0a90d32'}),base44.entities.ProjectVersion.filter({id:'6afef10e53bc0840b04d2482'})]);if(ps.length!==1||vs.length!==1)throw Error('Exact project/version unavailable');const p=ps[0],v=vs[0];const schedule=buildSpeakerDesignFromVersion(mergeProjectAndVersion(p,v));data={...schedule,projectName:p.name,clientName:p.client_name,versionName:v.version_name};node();await document.fonts.ready;measure(document,'screen');$('capture').disabled=false;$('large').disabled=false;status({project:p.id,version:v.id,layout:data.layout,groups:data.groups});}catch(e){status(e.stack)}};
async function capture(label){measurements=[];const n=node();await document.fonts.ready;measure(document,'screen');captured=await captureCompositionToPdf({...snapshotIssuedComposition('speaker_design',n),onProgress:p=>{status(p.message);const doc=[...document.querySelectorAll('iframe')].map(f=>f.contentDocument).find(d=>d?.querySelector('.speaker-design-schedule'));if(doc&&['Report fonts and images ready.','Report pagination complete.'].includes(p.message))measure(doc,p.message);}});link('Download '+label,URL.createObjectURL(captured.blob),label+'.pdf');status({label,pageCount:captured.pageCount,bytes:captured.blob.size});}
$('capture').onclick=async()=>{try{await capture('speaker-design-fresh');$('store').disabled=false}catch(e){status(e.stack)}};
$('large').onclick=async()=>{const original=data;try{data={...data,groups:data.groups.map(g=>({...g,rows:[...g.rows,...g.rows,...g.rows,...g.rows]}))};await capture('speaker-design-large-fixture');$('store').disabled=true;}catch(e){status(e.stack)}finally{data=original}};
$('store').onclick=async()=>{try{$('store').disabled=true;status('Uploading internal test PDF…'); if(!uploaded){uploaded=await base44.integrations.Core.UploadPrivateFile({file:new File([captured.blob],'INTERNAL-TEST-Speaker-Design-Dixon-2026-11-26.pdf',{type:'application/pdf'})});}if(!uploaded.file_uri)throw Error('Upload returned no path; do not repeat');const url=await resolveIssuedDocumentUrl({file_uri:uploaded.file_uri});const r=await fetch(url);if(!r.ok)throw Error('Stored PDF readback failed');const b=await r.blob();const digest=async blob=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))).map(x=>x.toString(16).padStart(2,'0')).join('');const expected=await digest(captured.blob),actual=await digest(b);if(expected!==actual)throw Error('Stored PDF bytes differ');link('Open stored internal PDF',url);link('Download verified stored PDF',URL.createObjectURL(b),'speaker-design-corrected-stored.pdf');status({stored:true,file_uri:uploaded.file_uri,sha256:actual,bytes:b.size,pageCount:captured.pageCount,projectAssetCreated:false});}catch(e){status(e.stack)}};
</script></body></html>
