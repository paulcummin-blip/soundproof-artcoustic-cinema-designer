<!doctype html><html><head><meta charset="utf-8"><title>Internal RP22 pill capture diagnostic</title></head><body>
<h1>Internal RP22 pill capture diagnostic</h1><p>No project records or stored documents are read or written.</p>
<button id="run">Capture baseline</button><button id="probe">Measure font probe</button><button id="fix">Capture with isolated probe correction</button>
<div id="downloads"></div><pre id="status" style="max-height:150px;overflow:auto">Loading</pre><div id="root"></div>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {flushSync} from 'react-dom';
import Pill from '/src/components/ui/RP22GradingPill.jsx';
import Badge from '/src/components/report/technical/TechnicalLevelBadge.jsx';
import Row from '/src/components/report/projectReport/AdiPillarParameterRow.jsx';
import PrintStyles from '/src/components/report/client/ClientReportPrintStyles.jsx';
import {captureCompositionToPdf} from '/src/components/library/compositionCapture.js';
import '/src/index.css';
const h=React.createElement;
const levels=[1,2,3,4,'FAIL','N/A','—'];
const pages=h('div',{className:'client-report-root'},h(PrintStyles),
 h('div',{className:'audit-page',style:{width:'186mm',height:'240mm',padding:'12px',background:'white',boxSizing:'border-box'}},
 h('h2',null,'Internal presentation test — not a client report'),
 ...['printCompact','report','app'].map(variant=>h('section',{key:variant,style:{padding:'14px 0'}},h('h3',null,variant),
 h('div',{style:{display:'flex',gap:12}},...levels.map(level=>h(Pill,{key:level,level,variant}))))),
 ...['normal','small'].map(size=>h('section',{key:size,style:{padding:'14px 0'}},h('h3',null,'Technical badge '+size),h('div',{style:{display:'flex',gap:12}},...levels.map(level=>h(Badge,{key:level,level,size}))))),
 h(Row,{print:true,parameter:{label:'P1',title:'Distance to Nearest Wall',scope:'Seat',seats:[{label:'Row 1',seats:[2,3,4,2,3].map((level,i)=>({level,seatId:String(i)}))}]}}),
 h(Row,{print:true,parameter:{label:'P18',title:'Bass Extension',scope:'Room',room:{level:3,value:'20 Hz'}}})));
flushSync(()=>createRoot(document.getElementById('root')).render(pages));
const output=document.getElementById('status');
function probe(inline=false){
 const family=getComputedStyle(document.querySelector('#root span')).fontFamily;
 const box=document.createElement('div'),img=document.createElement('img'),span=document.createElement('span');
 Object.assign(box.style,{visibility:'hidden',fontFamily:family,fontSize:'10px',margin:'0',padding:'0',whiteSpace:'nowrap'});
 Object.assign(img.style,{margin:'0',padding:'0',verticalAlign:'baseline'});
 if(inline)img.style.display='inline-block';
 img.width=1;img.height=1;img.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
 Object.assign(span.style,{fontFamily:family,fontSize:'10px',margin:'0',padding:'0'});span.textContent='Hidden Text';
 box.append(span,img);document.body.append(box);
 const result={inline,baseline:img.offsetTop-span.offsetTop+2,imgDisplay:getComputedStyle(img).display,lineHeight:getComputedStyle(box).lineHeight,font:family,spanHeight:span.getBoundingClientRect().height};box.remove();return result;
}
document.getElementById('probe').onclick=()=>output.textContent=JSON.stringify([probe(),probe(true)],null,2);
async function capture(fix=false){
 let style;if(fix){style=document.createElement('style');style.textContent='body > div[style*="visibility: hidden"] > img {display:inline-block !important;}';document.head.append(style);}
 try{
 const snapshots=[];
 const result=await captureCompositionToPdf({nodeHtml:document.querySelector('.client-report-root').outerHTML,pageSelector:'.audit-page',bodyClass:'client-report-printing',onProgress:p=>{
 output.textContent=JSON.stringify(p);
 if(p.stage==='capture'){
 const doc=document.querySelector('iframe[title="Issued document capture"]')?.contentDocument;
 if(doc)snapshots.push([...doc.querySelectorAll('span, .tech-seat-badge')].filter(e=>/^(L[1-4]|FAIL|N\/A|—)$/.test(e.textContent)).map(e=>{const s=doc.defaultView.getComputedStyle(e),r=e.getBoundingClientRect();return {label:e.textContent,width:r.width,height:r.height,font:s.fontFamily,fontSize:s.fontSize,lineHeight:s.lineHeight,display:s.display};}));
 }}});
 const a=document.createElement('a');a.download=fix?'pill-probe-corrected.pdf':'pill-after.pdf';a.href=URL.createObjectURL(result.blob);a.textContent='Download '+a.download;document.getElementById('downloads').append(a,document.createElement('br'));
 output.textContent=JSON.stringify({pageCount:result.pageCount,rendering:result.rendering,diagnostics:result.captureDiagnostics,probe:[probe(),probe(true)],snapshots},null,2);
 }catch(e){output.textContent=e.stack;}finally{style?.remove();}
}
document.getElementById('run').onclick=()=>capture();
document.getElementById('fix').onclick=()=>capture(true);
output.textContent='Ready';
</script></body></html>
